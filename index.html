<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#ffffff"><title>ChatGPT Flashlight V5</title>
<style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;font-family:system-ui,sans-serif;background:#fff;touch-action:manipulation}#light{position:fixed;inset:0;background:#fff}#shade{position:absolute;inset:0;background:#000;opacity:0;pointer-events:none}#controls{position:fixed;bottom:calc(18px + env(safe-area-inset-bottom));left:12px;right:12px;max-width:600px;margin:auto;padding:16px;background:#171717f2;color:#fff;border-radius:20px;display:grid;gap:12px;box-shadow:0 3px 25px #0005}#bar{display:flex;align-items:center;gap:12px}#brightness{flex:1;min-width:0;width:100%;height:38px;accent-color:#fff;touch-action:none;cursor:pointer}button{border:0;border-radius:12px;background:#454545;color:white;font-size:15px;padding:12px 16px}#buttons{display:flex;gap:10px}#buttons button{flex:1}#percent{min-width:46px;text-align:right;font-variant-numeric:tabular-nums}#hint{text-align:center;color:#bbb;font-size:12px}body.hidden #controls{display:none}#reveal{position:fixed;inset:0;display:none}body.hidden #reveal{display:block}
</style></head><body><div id="light"><div id="shade"></div></div><div id="reveal" aria-label="Show controls"></div><div id="controls"><div id="bar"><span>☀</span><input id="brightness" type="range" min="0" max="100" value="100" step="1" aria-label="Screen brightness"><output id="percent" for="brightness">100%</output></div><div id="buttons"><button id="power">Turn off</button><button id="fullscreen">⛶ Fullscreen</button><button id="hide">Hide controls</button></div><div id="hint">Adjusts the light color, not your phone's hardware brightness. Open in Chrome if preview controls don't respond.</div></div>
<script>
(function(){'use strict';const slider=document.getElementById('brightness'),shade=document.getElementById('shade'),pct=document.getElementById('percent'),power=document.getElementById('power'),theme=document.querySelector('meta[name="theme-color"]');let on=true;function update(){const value=Number(slider.value);const v=on?value:0;shade.style.opacity=String(1-v/100);pct.textContent=v+'%';power.textContent=on?'Turn off':'Turn on';const c=Math.round(v*255/100);theme.setAttribute('content',`rgb(${c},${c},${c})`)}slider.addEventListener('input',update);slider.addEventListener('change',update);power.addEventListener('click',function(){on=!on;update()});document.getElementById('hide').addEventListener('click',function(){document.body.classList.add('hidden')});document.getElementById('reveal').addEventListener('click',function(){document.body.classList.remove('hidden')});document.getElementById('fullscreen').addEventListener('click',async function(){try{if(document.fullscreenElement)await document.exitFullscreen();else await document.documentElement.requestFullscreen()}catch(e){alert('Fullscreen is blocked in this viewer. Open the HTML file in Chrome instead.')}});update()})();
</script></body></html>
